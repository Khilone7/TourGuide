name: TourGuide Pipeline
run-name: ${{ github.actor }} do a push
on: [push]
jobs:
  build_job:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
      - run: ./mvnw compile

  test_job:
    name: Test
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
      - run: ./mvnw test

  package_job:
    name: Package
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
      - run: ./mvnw package
      - uses: actions/upload-artifact@v6
        with:
          name: tourguide-jar
          path: target/*.jar
